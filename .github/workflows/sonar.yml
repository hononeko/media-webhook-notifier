name: SonarQube / SonarCloud Analysis

on:
  push:
    branches: ["main", "master"]
  pull_request:
    # `edited` fires when GitHub retargets a stacked PR after its base merges; jobs skip other edits.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Title/body-only edits get a throwaway group so they never cancel an in-flight run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  sonar:
    if: github.event.action != 'edited' || github.event.changes.base
    name: Sonar Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Build & Test
        run: ./gradlew check --no-daemon

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
