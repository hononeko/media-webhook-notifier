name: Validate

on:
  workflow_call:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run Lint, Test & Coverage
        run: ./gradlew ktlintCheck test jacocoTestReport --no-daemon

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Ktlint formatting and Gradle unit/integration tests completed successfully." >> $GITHUB_STEP_SUMMARY
