name: Validate

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Tag for the docker image to build and scan"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: media-webhook-notifier

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Lint, Test & Coverage
        run: ./gradlew ktlintCheck test jacocoTestReport --no-daemon

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Ktlint formatting and Gradle unit/integration tests completed successfully." >> $GITHUB_STEP_SUMMARY

  build-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image (Dry Run)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          build-args: |
            GRADLE_ARGS=-PquickBuild
          cache-from: type=gha
          cache-to: type=gha,mode=max
