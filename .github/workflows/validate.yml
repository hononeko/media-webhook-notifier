name: Validate

on:
  workflow_call:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Lint workflows and actions
        uses: hononeko/actions/lint-actions@v1

      - name: Lint Dockerfile
        uses: hononeko/actions/lint-docker@v1

      - name: Lint Kotlin (detekt)
        uses: hononeko/actions/lint-kotlin@v1

      - name: Run Lint, Test & Coverage
        run: ./gradlew ktlintCheck test jacocoTestReport --no-daemon

      # Overall coverage is reported; a pull request's changed lines must be 80% covered.
      - name: Coverage
        uses: hononeko/actions/coverage@v1
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          min-changed-coverage: "80"

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Ktlint formatting and Gradle unit/integration tests completed successfully." >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Integration Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Testcontainers integration tests completed successfully." >> "$GITHUB_STEP_SUMMARY"
