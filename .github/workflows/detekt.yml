name: "Detekt Analysis"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "20 0 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DETEKT_RELEASE_TAG: "v1.23.8"

jobs:
  detekt:
    name: Detekt Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Cache Detekt CLI
        id: cache-detekt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.detekt
          key: ${{ runner.os }}-detekt-${{ env.DETEKT_RELEASE_TAG }}

      - name: Setup Detekt CLI
        run: |
          mkdir -p ~/.detekt
          DETEKT_JAR=~/.detekt/detekt-cli.jar
          if [ ! -f "$DETEKT_JAR" ]; then
            VERSION_NUM="${DETEKT_RELEASE_TAG#v}"
            DOWNLOAD_URL="https://github.com/detekt/detekt/releases/download/${DETEKT_RELEASE_TAG}/detekt-cli-${VERSION_NUM}-all.jar"
            echo "Downloading Detekt CLI from $DOWNLOAD_URL..."
            curl -sSL --retry 5 --retry-delay 2 --retry-all-errors "$DOWNLOAD_URL" -o "$DETEKT_JAR"
          fi

          mkdir -p ~/.local/bin
          cat << 'EOF' > ~/.local/bin/detekt
          #!/usr/bin/env bash
          exec java -jar "$HOME/.detekt/detekt-cli.jar" "$@"
          EOF
          chmod +x ~/.local/bin/detekt
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Detekt
        continue-on-error: true
        run: |
          detekt \
            --input "${{ github.workspace }}/src" \
            --base-path "${{ github.workspace }}" \
            --config "${{ github.workspace }}/config/detekt/detekt.yml" \
            --build-upon-default-config \
            --report "sarif:${{ github.workspace }}/detekt.sarif.json"

      - name: Upload Detekt SARIF Report
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/detekt.sarif.json
          checkout_path: ${{ github.workspace }}
