name: Main Validation

on:
  push:
    branches: ["master", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: read

  # Both architectures' native images, built and smoke-tested on every push to main; nothing is pushed.
  native:
    needs: validate
    uses: ./.github/workflows/native-image.yml
    permissions:
      contents: read
