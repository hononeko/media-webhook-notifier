name: Main Validation

on:
  push:
    branches: ["master", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: media-webhook-notifier

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: read

  build-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup GraalVM (Java 25)
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup Musl Toolchain & Static zlib
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools make gcc
          if ! curl -fSL --retry 5 --retry-delay 2 --retry-all-errors https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib.tar.gz; then
            curl -fSL --retry 5 --retry-delay 2 --retry-all-errors https://zlib.net/fossils/zlib-1.3.1.tar.gz -o zlib.tar.gz
          fi
          tar -xzf zlib.tar.gz
          cd zlib-1.3.1
          CC=musl-gcc ./configure --prefix=/usr/local/musl --static
          make -j$(nproc)
          sudo make install
          cd .. && rm -rf zlib-1.3.1 zlib.tar.gz
          sudo mkdir -p /usr/lib/x86_64-linux-musl /usr/include/x86_64-linux-musl
          sudo cp /usr/local/musl/lib/libz.a /usr/lib/x86_64-linux-musl/libz.a
          sudo cp /usr/local/musl/include/zlib* /usr/include/x86_64-linux-musl/

      - name: Compile Native Binary (Static QuickBuild)
        run: ./gradlew nativeCompile -Pstatic -PquickBuild --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Distroless Docker image (Dry Run)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:main-test
