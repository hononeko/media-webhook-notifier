name: Continuous Delivery & Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test both architectures without pushing, tagging or releasing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: media-webhook-notifier

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      version_type: ${{ steps.version.outputs.version_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: version
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          change_path: "."
          bump_each_commit: false
          search_commit_body: true
          tag_prefix: ""
          major_pattern: "/!:|BREAKING CHANGE:|BREAKING:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          # docs: and test: commits never bump the version; every other type bumps at least the patch.
          ignore_commits_pattern: "/^(docs|test)(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"

      # version_type is "none" when every commit since the last tag was ignored, or HEAD is already tagged.
      - name: Report skipped release
        if: steps.version.outputs.version_type == 'none'
        run: echo "::notice title=Release skipped::No version-bumping commits since the last tag (only docs:/test:, or HEAD is already tagged)."

  # Both architectures, compiled natively on their own runners and smoke tested. Real releases push each image by
  # digest; the release job then joins them under one multi-arch tag.
  native:
    needs: version
    if: inputs.dry_run || needs.version.outputs.version_type != 'none'
    uses: ./.github/workflows/native-image.yml
    with:
      push: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      packages: write

  release:
    name: Publish, Tag & Release
    needs: [version, native]
    # Only main publishes: a dispatch on another branch can still dry-run the build.
    if: ${{ !inputs.dry_run && needs.version.outputs.version_type != 'none' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Create multi-arch manifest
        id: manifest
        working-directory: digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::Expected 2 architecture digests (amd64, arm64), got ${#sources[@]}"
            exit 1
          fi
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}"
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" > changelog.txt
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" > changelog.txt
          fi

      - name: Push Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ needs.version.outputs.version_tag }}
          git push origin ${{ needs.version.outputs.version_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          body_path: changelog.txt
