name: PR Validation

on:
  pull_request:
    # No base-branch filter and no `edited` trigger: stacked PRs are checked on every push, so after a
    # retarget to main the required checks are already on the head commit, and description edits run nothing.
    # labeled: adding the snapshot label publishes a snapshot of the branch (see the snapshot job).
    types: [opened, synchronize, reopened, labeled]

# Any other label gets a group of its own, so labelling never cancels a running build.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'snapshot' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validate:
    # Labelling re-runs the checks only for the snapshot label.
    if: github.event.action != 'labeled' || github.event.label.name == 'snapshot'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: read

  integration-test:
    name: Integration Tests
    if: github.event.action != 'labeled' || github.event.label.name == 'snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Testcontainers integration tests completed successfully." >> $GITHUB_STEP_SUMMARY

  # Native images are only built in pull requests for a snapshot: with the snapshot label, on a branch of this
  # repository (never a fork's, whose code mustn't run with a token that can push). The snapshot's name comes from the
  # pull request's head commit, which is what's built.
  version:
    needs: validate
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
    uses: ./.github/workflows/version.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read

  native:
    needs: [validate, version]
    uses: ./.github/workflows/native-image.yml
    with:
      push: true
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      packages: write

  # Joins the pushed images into a multi-arch snapshot, tagged pr-<PR>-sha-<commit> and pr-<PR> (the newest), and keeps
  # a comment on the pull request naming it. snapshot-cleanup.yml deletes the snapshots when the pull request closes.
  snapshot:
    name: Publish Snapshot
    needs: [version, native]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      attestations: write
      id-token: write
      pull-requests: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch snapshot
        uses: hononeko/actions/publish-image@3898710c9118a72c6d5a7fcedeaea0156469abd8 # v1.3.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/media-webhook-notifier
          tags: |
            ${{ needs.version.outputs.snapshot_tag }}
            pr-${{ github.event.pull_request.number }}
          expected-digests: "2"
          title: Snapshot
          comment-on-pr: ${{ github.event.pull_request.number }}
          comment-note: For testing only, never for the gitops repository. Deleted when this pull request closes.
