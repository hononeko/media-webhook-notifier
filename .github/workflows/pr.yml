name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: read

  # Native images are only built in pull requests for a snapshot: with the snapshot label, on a branch of this
  # repository (never a fork's, whose code mustn't run with a token that can push). The snapshot's name comes from the
  # pull request's head commit, which is what's built.
  version:
    needs: validate
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
    uses: ./.github/workflows/version.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read

  native:
    needs: [validate, version]
    uses: ./.github/workflows/native-image.yml
    with:
      push: true
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      packages: write

  # Joins the pushed images into a multi-arch snapshot, tagged pr-<PR>-sha-<commit> and pr-<PR> (the newest), and keeps
  # a comment on the pull request naming it. snapshot-cleanup.yml deletes the snapshots when the pull request closes.
  snapshot:
    name: Publish Snapshot
    needs: [version, native]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      attestations: write
      id-token: write
      pull-requests: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch snapshot
        uses: hononeko/actions/publish-image@5532ca1e4b7254aed1f85fe64b6230941d6eed21 # v1.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/media-webhook-notifier
          tags: |
            ${{ needs.version.outputs.snapshot_tag }}
            pr-${{ github.event.pull_request.number }}
          expected-digests: "2"
          title: Snapshot
          comment-on-pr: ${{ github.event.pull_request.number }}
          comment-note: For testing only, never for the gitops repository. Deleted when this pull request closes.
