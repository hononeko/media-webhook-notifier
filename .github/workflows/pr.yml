name: PR Validation

on:
  pull_request:
    branches: ["master", "main"]
    # `edited` fires when GitHub retargets a stacked PR after its base merges; jobs skip other edits.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Title/body-only edits get a throwaway group so they never cancel an in-flight run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.action != 'edited' || github.event.changes.base
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: read

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base)
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java (Temurin 25)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Testcontainers integration tests completed successfully." >> $GITHUB_STEP_SUMMARY

