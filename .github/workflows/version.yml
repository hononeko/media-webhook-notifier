name: Version

# The next stable version and the release-candidate name for the current commit. Shared by main.yml (publishes the
# RC) and cd.yml (promotes it), so both always agree on the version and on the commit tag that links them.
on:
  workflow_call:
    outputs:
      version:
        description: Next stable version, e.g. 2.14.0
        value: ${{ jobs.version.outputs.version }}
      version_tag:
        description: Git tag for the next stable version
        value: ${{ jobs.version.outputs.version_tag }}
      version_type:
        description: major, minor, patch, or none when there's nothing to release
        value: ${{ jobs.version.outputs.version_type }}
      rc_version:
        description: Release-candidate version of this commit, e.g. 2.14.0-rc.3
        value: ${{ jobs.version.outputs.rc_version }}
      commit_tag:
        description: Image tag identifying this commit, e.g. sha-1a2b3c4
        value: ${{ jobs.version.outputs.commit_tag }}
      last_tag:
        description: The previous stable git tag (empty for the first release)
        value: ${{ jobs.version.outputs.last_tag }}

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      version_type: ${{ steps.version.outputs.version_type }}
      rc_version: ${{ steps.rc.outputs.rc_version }}
      commit_tag: ${{ steps.rc.outputs.commit_tag }}
      last_tag: ${{ steps.rc.outputs.last_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: version
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          change_path: "."
          bump_each_commit: false
          search_commit_body: true
          tag_prefix: ""
          major_pattern: "/!:|BREAKING CHANGE:|BREAKING:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          # docs: and test: commits never bump the version; every other type bumps at least the patch.
          ignore_commits_pattern: "/^(docs|test)(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"

      # N counts every commit since the last stable tag, so each push to main gets a new RC number. The action's own
      # `increment` skips docs:/test: commits and could repeat one.
      - name: Release candidate
        id: rc
        run: |
          last=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ]; then n=$(git rev-list --count "$last..HEAD"); else n=$(git rev-list --count HEAD); fi
          {
            echo "rc_version=${{ steps.version.outputs.version }}-rc.$n"
            echo "commit_tag=sha-${GITHUB_SHA::7}"
            echo "last_tag=$last"
          } >> "$GITHUB_OUTPUT"
          echo "Release candidate ${{ steps.version.outputs.version }}-rc.$n (sha-${GITHUB_SHA::7}), last stable tag: ${last:-none}"

      # version_type is "none" when every commit since the last tag was ignored, or HEAD is already tagged.
      - name: Report nothing to release
        if: steps.version.outputs.version_type == 'none'
        run: echo "::notice title=Nothing to release::No version-bumping commits since the last tag (only docs:/test:, or HEAD is already tagged)."
