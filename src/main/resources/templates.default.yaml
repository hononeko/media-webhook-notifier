# ==============================================================================
# Built-in Default Templates
# ==============================================================================
# Every event is enabled unless a template sets `enabled: false` (or `disabled: true`), e.g.
#   events:
#     servarr:
#       import:
#         enabled: false
# The download card is one message edited in place: disabling `servarr.grab` stops download tracking entirely,
# disabling `download.progress` keeps the grab card until the download ends, and disabling `download.complete` or
# `download.stalled` leaves the card as it last was.
theme:
  max_overview_length: 240
  progress_bar_length: 10
  progress_bar_style: "default"
  date_format: "yyyy-MM-dd HH:mm"

events:
  download:
    progress:
      silent: true
      title: "⏳ Downloading {title} from {indexer}"
      subtitle: "{instance_name}"
      body: |
        {episode_tracks}
        <code>{progress_bar}</code> <b>{progress_percent}%</b>

        ▪ <b>Release:</b> {release_name}
        ▪ <b>Speed:</b> {speed} (ETA: {eta})
        ▪ <b>Transferred:</b> {size_formatted}
        ▪ <b>Peers:</b> {peers_info}
        ▪ <b>Status:</b> {state}

    complete:
      silent: false
      title: "✅ Download Complete: {title}"
      subtitle: "{instance_name}"
      body: |
        ▪ <b>Release:</b> {release_name}
        ▪ <b>Status:</b> 100% Downloaded
        ▪ <b>Total Size:</b> {total_size}

    stalled:
      silent: false
      title: "⚠️ Download Stalled: {title}"
      subtitle: "{instance_name}"
      body: |
        ▪ <b>Release:</b> {release_name}
        ▪ <b>Status:</b> Download Stalled (0 B/s)
        ▪ <b>Progress:</b> {progress_percent}% <code>{progress_bar}</code>

  servarr:
    grab:
      silent: true
      image_embed: true
      title: "⏳ Downloading {title} from {indexer}"
      subtitle: "{instance_name}"
      body: |
        ▪ <b>Release:</b> {release_name}
        ▪ <b>Quality:</b> {quality}
        ▪ <b>Size:</b> {size}

    import:
      silent: true
      image_embed: false
      title: "{import_icon} {import_action}: {title}"
      subtitle: "{instance_name} • {import_type}"
      body: |
        ▪ <b>Specs:</b> {specs}
        ▪ <b>Size:</b> {size}

        <i>{overview}</i>

    manual_interaction:
      silent: false
      image_embed: false
      title: "✋ Manual Import Required: {title}"
      subtitle: "{instance_name} • Manual Intervention"
      body: |
        ▪ <b>Reason:</b> {reason}
        ▪ <b>Release:</b> {release_title}
        ▪ <b>Quality:</b> {quality}
        ▪ <b>Size:</b> {size}
      actions:
        - label: "📁 Open in {source_name}"
          url: "{web_url}/activity/queue"
          style: "PRIMARY"

    health:
      silent: false
      title: "{health_icon} {health_status}: {instance_name}"
      subtitle: "{instance_name} • {health_type}"
      body: |
        ▪ <b>Issue:</b> {issue_type}
        ▪ <b>Diagnostic:</b> {message}

  media_server:
    available:
      silent: false
      image_embed: true
      # true: use the poster URL instead of the image the media server uploads with the webhook
      prefer_poster: false
      title: "🍿 {title} now available on {media_server_name}"
      body: |
        ▪ <b>Specs:</b> {specs}
        ▪ <b>Rating:</b> {rating}
        ▪ <b>Duration:</b> {duration}

        <i>{overview}</i>
      actions:
        - label: "🎬 Watch on {media_server_name}"
          url: "{deep_link_url}"
          style: "PRIMARY"

    # The pinned status message (MEDIA_SERVER_STATUS_MONITOR_ENABLED=true). Edits are silent; recovery replaces and
    # re-pins with a notification unless `status_online.silent: true`. Lines whose tags are empty are left out.
    status_online:
      title: "🟢 {media_server_name} — Online"
      body: |
        ▪ <b>Back up at:</b> {since} (downtime: {downtime})

    status_offline:
      silent: true
      title: "🔴 {media_server_name} — Offline"
      body: |
        ▪ <b>Down since:</b> {since}
        ▪ <b>Downtime:</b> {downtime}
        ▪ <b>Error:</b> {error}
        ▪ <b>Last checked:</b> {checked_at}

  seerr:
    request:
      silent: false
      image_embed: true
      title: "{request_icon} {request_action}: {subject}"
      subtitle: "{instance_name} • {request_status}"
      body: |
        ▪ <b>Requested By:</b> {requested_by}
        ▪ <b>Media Type:</b> {media_type}
        ▪ <b>Quality:</b> {quality}
        ▪ <b>Details:</b> {message}
      actions:
        - label: "🌐 Open in {source_name}"
          url: "{web_url}"
          style: "PRIMARY"

    issue:
      silent: false
      image_embed: false
      title: "{request_icon} {request_action}: {subject}"
      subtitle: "{instance_name} • {request_status}"
      body: |
        ▪ <b>Reported By:</b> {requested_by}
        ▪ <b>Issue Type:</b> {issue_type}
        ▪ <b>Issue Status:</b> {issue_status}
        ▪ <b>Comment:</b> {comment}
        ▪ <b>Details:</b> {message}
      actions:
        - label: "⚠️ View Issue in {source_name}"
          url: "{web_url}/issues"
          style: "PRIMARY"

  # cross-seed webhooks (CROSS_SEED_ENABLED=true). `match` covers injected and saved torrents, `failure` failed
  # injections. Route them elsewhere with `chat_id` / `topic_id`, or turn either off with `enabled: false`.
  cross_seed:
    match:
      silent: true
      image_embed: false
      title: "{result_icon} {result_action}: {name}"
      subtitle: "{instance_name} • {trigger}"
      body: |
        ▪ <b>Trackers:</b> {trackers}
        ▪ <b>Match:</b> {decisions}
        ▪ <b>Status:</b> {status}
        ▪ <b>Size:</b> {size}
        ▪ <b>Category:</b> {category}

    failure:
      silent: false
      image_embed: false
      title: "{result_icon} {result_action}: {name}"
      subtitle: "{instance_name} • {trigger}"
      body: |
        ▪ <b>Trackers:</b> {trackers}
        ▪ <b>Match:</b> {decisions}
        ▪ <b>Size:</b> {size}
        ▪ <b>Category:</b> {category}
        ▪ <b>Client:</b> {client_host}
