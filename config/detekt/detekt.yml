complexity:
  CyclomaticComplexMethod:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
  LargeClass:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
  LongMethod:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
  LongParameterList:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
  NestedBlockDepth:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
  TooManyFunctions:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']

style:
  LoopWithTooManyJumpStatements:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
  MagicNumber:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/*.kts']
    # A literal assigned to a named property or local val is already explained by its name.
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    # Defaults plus common unit conversions (seconds, KiB, hours, days).
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '10', '60', '100', '1000', '1024', '3600', '86400']
  ReturnCount:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**']
    # Early-return guard clauses and short first-match lookups are idiomatic Kotlin; longer chains of returns are not.
    excludeGuardClauses: true
    max: 3
